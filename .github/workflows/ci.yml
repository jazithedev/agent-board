name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (these also scan everything published for personal data)
        run: python -m unittest discover -v

  installer:
    name: Installer and command line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Shell lint
        run: |
          sh -n install.sh
          shellcheck install.sh
      - name: Install into an empty home, update, run, uninstall
        env:
          AGENT_BOARD_SOURCE: ${{ github.workspace }}
          AGENT_BOARD_CLAUDE: no-such-claude-on-this-runner
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          sh install.sh
          "$HOME/.local/bin/agent-board" --version
          "$HOME/.local/bin/agent-board" --dump --demo --view review | head -5
          sh install.sh | grep "updating the existing copy"
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/agent-board"

  packaging:
    name: Packaging (wheel and command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs and the command runs
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/agent-board" --version
          "$RUNNER_TEMP/venv/bin/agent-board" --dump --demo | head -3

  manifests:
    name: Plugin and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_manifests.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflow files themselves
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # One check to require in branch protection: green only when every job above is green.
  ci:
    name: CI passed
    if: always()
    needs: [lint, tests, installer, packaging, manifests, secrets, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "Every check passed."
