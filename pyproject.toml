[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-board"
dynamic = ["version"]
description = "A keyboard-driven terminal board for your Claude Code background sessions, with projects, tags, pull requests and limits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krzysztof Trzos (Jazi)" }]
keywords = ["claude", "claude-code", "tui", "terminal", "agents", "curses"]
classifiers = [
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/jazithedev/agent-board"
Issues = "https://github.com/jazithedev/agent-board/issues"

[project.scripts]
agent-board = "agent_board:cli"

[tool.setuptools]
py-modules = ["agent_board", "pullrequests"]

[tool.setuptools.dynamic]
version = { attr = "agent_board.__version__" }

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# E4/E7/E9 and F: pycodestyle errors and pyflakes (unused or undefined names, broken syntax); B: flake8-bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# E741: `l` is used for a line of the screen throughout, in short comprehensions only.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tests assign small lambdas as fakes for subprocess runners and similar.
"test_*.py" = ["E731"]
